<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FlexBox Nav</title>
 <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css' integrity='sha512-GmZYQ9SKTnOea030Tbiat0Y+jhnYLIpsGAe6QTnToi8hI2nNbVMETHeK4wm4MuYMQdrc38x+sX77+kVD01eNsQ==' crossorigin='anonymous'/>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="../jquery.js" defer></script>
  <script src="js.js" defer></script>
</head>
<body>
    <div class="wrapper">

        <header class="top">
            <h1><a href="#">Site them. Me</a></h1>
        </header>   

    <nav class="flex-nav">
        <a href="#" class="toggleNav">☰ Menu</a>
        <ul>
        <li><a href="#">Item 01</a></li>
         <li><a href="#">Item 02</a></li>
         <li><a href="#">Item 03</a></li>
         <li><a href="#">Item 04</a></li>
         <li><a href="#">Item 05</a></li>
         <li><a href="#">Item 06</a></li>
         <li class="social">
           <a href="#"><i class="fa fa-twitter"></i></a>
       </li>
       <li class="social">
           <a href="#"><i class="fa fa-facebook"></i></a>
       </li>
       <li class="social">
           <a href="#"><i class="fa fa-github"></i></a>
       </li>
       <li class="social">
           <a href="#"><i class="fa fa-instagram"></i></a>
       </li>
   </ul>
</nav>

<section class="banner">
   <img src="http://lorempixel.com/1000/600/abstract">
</section>

<section class="content">

</section>

<section class="signup">

     <input type="text" placeholder="Your Name">
     <input type="email" placeholder="Email Address">
     <input type="submit" value="Sign me up!">
 </form>
</section>

<footer>

</footer>

</div>

<script
src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js">
</script>
<script>
	$(function() {
     $('.toggleNav').on('click',function() {
       $('.flex-nav ul').toggleClass('open');
   });
 });

</script>
<div class="themeButton">
    <i class="fa-solid fa-sun"></i>
</div>
</body>
</html>
